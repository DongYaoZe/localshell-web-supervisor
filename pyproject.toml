[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localshell-web-supervisor"
version = "0.11.0"
description = "Durable local supervisor for browser-driven Local Shell MCP agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "LWS contributors"}]
dependencies = []

[project.optional-dependencies]
cdp = ["playwright>=1.50"]

[project.scripts]
lws = "lws.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
